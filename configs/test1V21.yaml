# Reverse Curriculum Generation autour du goal; tâche et reward héritées de V20.
extends: test1V20.yaml

curriculum:
  enabled: true

  curriculum_reset_probability: 0.80 #probability to begin with the curiculum (otherwise start from true start state)

  #servent à classer les états candidats selon la politique actuelle :
  # <10 % de succès → trop difficile ;
  # 10–90 % → intéressant pour apprendre ;
  # >90 % → maîtrisé, donc utile pour continuer les branches reverse.
  success_rate_low: 0.10
  success_rate_high: 0.90

  update_interval_timesteps: 50000 #tous les 50k steps d'entraînement, on met à jour le curriculum : génération de nouveaux états, qualification, mise à jour des pools.

  candidates_per_update: 32 #à chaque mise à jour, on cherche à évaluer environ 32 nouveaux états candidats.
  evaluation_rollouts_per_candidate: 5 #cinq rollouts donnent les niveaux 0/20/40/60/80/100 %, plus stables que trois.

  max_pool_size: 2000 #au maximum 2000 états de départ stockés. C'est juste une protection mémoire et contre un curriculum énorme/redondant.

  # Fractions conditionnelles aux 80 % de resets curriculum : elles donnent
  # globalement 50 % frontier, 30 % historique et 20 % true-start.
  start_sampling:
    frontier_fraction: 0.625
    historical_fraction: 0.375
    historical_bins: 4

  # À chaque update du curriculum, on reprend 8 états actuellement classés mastered , 12 too_hard et on reteste la policy dessus.
  # Le but est de les reclasser.
  revalidation:
    mastered_samples_per_update: 8
    too_hard_samples_per_update: 12

  # Les enfants prolongent le lineage physique; leur pose_distance peut
  # augmenter ou diminuer par rapport au parent.
  reverse_random_walk:
    walks_per_seed: 8 #signifie qu'à partir d'un état servant de seed, on lance 8 petites explorations aléatoires différentes.
    max_steps: 20 #ignifie que chaque petite exploration inverse fait au maximum 20 actions. Avec 50 Hz, ça correspond au maximum à environ 0,4 s de simulation.
    action_scale: 0.5 #signifie que les actions aléatoires utilisées pour générer les resets sont limitées à [-0.5,0.5], avec max_translation_step: 0.0005 ona  au max 0.25mm par step pdt la génération du curiculum

  deduplication: #sert à éviter les doublons.
    position_tolerance: 0.0005
    rotation_tolerance_deg: 0.5
