name: mujoco-assembly-rl
x-base: &base
  build: .
  init: true
  working_dir: /workspace
  gpus: all
  volumes:
    - ./:/workspace
    - ./data/input:/data/input:ro
    - ./data/output:/workspace/data/output
  environment:
    PYTHONPATH: /workspace
    MUJOCO_GL: egl
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    MODEL_PATH: ${MODEL_PATH:-}
    MODEL_PATHS: ${MODEL_PATHS:-}
    EVAL_RESULT_NAME: ${EVAL_RESULT_NAME:-}
    EVAL_ALL_CHECKPOINTS: ${EVAL_ALL_CHECKPOINTS:-}
    EVAL_TRAJECTORY: ${EVAL_TRAJECTORY:-}
    TOTAL_TIMESTEPS: ${TOTAL_TIMESTEPS:-}
    RESUME_MODEL: ${RESUME_MODEL:-}
    RESUME_REPLAY_BUFFER: ${RESUME_REPLAY_BUFFER:-}
    RESUME_CURRICULUM: ${RESUME_CURRICULUM:-}
services:
  train:
    <<: *base
    command: >-
      /bin/sh -c 'set -- python -m src.train --config "${CONFIG:-configs/test1.yaml}"
      --run "${RUN_NAME:-test1}";
      if [ -n "$$TOTAL_TIMESTEPS" ]; then
      set -- "$$@" --timesteps "$$TOTAL_TIMESTEPS"; fi;
      if [ -n "$$RESUME_MODEL" ]; then
      set -- "$$@" --resume-model "$$RESUME_MODEL"; fi;
      if [ -n "$$RESUME_REPLAY_BUFFER" ]; then
      set -- "$$@" --resume-replay-buffer "$$RESUME_REPLAY_BUFFER"; fi;
      if [ -n "$$RESUME_CURRICULUM" ]; then
      set -- "$$@" --resume-curriculum "$$RESUME_CURRICULUM"; fi;
      exec "$$@"'
  evaluate:
    <<: *base
    command: python -m src.evaluate --run data/output/${RUN_NAME:-test1} --episodes ${EVAL_EPISODES:-20}
  evaluate-gui:
    <<: *base
    volumes:
      - ./:/workspace
      - ./data/input:/data/input:ro
      - ./data/output:/workspace/data/output
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      PYTHONPATH: /workspace
      MUJOCO_GL: glfw
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      MODEL_PATH: ${MODEL_PATH:-}
      MODEL_PATHS: ${MODEL_PATHS:-}
      EVAL_RESULT_NAME: ${EVAL_RESULT_NAME:-}
      EVAL_ALL_CHECKPOINTS: ${EVAL_ALL_CHECKPOINTS:-}
      EVAL_TRAJECTORY: ${EVAL_TRAJECTORY:-}
    command: python -m src.evaluate --run data/output/${RUN_NAME:-test1} --episodes ${EVAL_EPISODES:-20} --render --render-speed ${RENDER_SPEED:-1.0}
  debug:
    <<: *base
    volumes:
      - ./:/workspace
      - ./data/input:/data/input:ro
      - ./data/output:/workspace/data/output
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      PYTHONPATH: /workspace
      MUJOCO_GL: glfw
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    command: python -m src.debug --config ${CONFIG:-configs/test0.yaml}
  tensorboard:
    <<: *base
    ports: ["${TENSORBOARD_PORT:-6006}:6006"]
    command: tensorboard --logdir data/output --host 0.0.0.0
